name: Nifty Multi-Regime Engine Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

        - name: Run Clean Engine Backtest
      env:
        PYTHONWARNINGS: "ignore"
        PYTHONUNBUFFERED: "1"
      run: |
        python -c "import app; df = app.fetch_ohlcv('NIFTY', '5m', period='30d'); df = app.add_indicators(df); win_rate, total_trades, total_pnl, df_trades = app.run_vectorized_backtest(df); print(f'Total Trades Executed: {total_trades}'); print(f'Strategy Win-Rate: {win_rate}%'); print(f'Total PnL Points: {total_pnl}'); print(df_trades.tail(10).to_string())"

