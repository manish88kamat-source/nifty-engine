name: Nifty Multi-Regime Engine Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Clean Engine Backtest
        env:
          PYTHONUNBUFFERED: "1"
          RUN_TESTS: "1"
        run: |
          python app.py
